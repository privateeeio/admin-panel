<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#f8fbff,#eef5ff,#ffffff);
  margin:0;
  padding:15px;
}
.login-box,.card,.topbar{
background:rgba(255,255,255,0.6);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.8);
border-radius:16px;
box-shadow:0 10px 40px rgba(37,99,235,0.15);
}
#loginDiv{height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{padding:25px;width:90%;max-width:350px;text-align:center}
h2,h3{
  color:#1e3a8a;
}
input{
width:95%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:1px solid rgba(37,99,235,0.2);
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
outline:none;
transition:0.25s;
box-shadow:inset 0 2px 6px rgba(0,0,0,0.05);
}
input:focus{
border:1px solid #3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,0.2);
background:rgba(255,255,255,1);
}
button{
  padding:8px 12px;

  border:none;
  border-radius:8px;

}
.card{

margin-bottom:15px;
background:rgba(255,255,255,0.65);

.user{border-left:5px solid #3b82f6}

body.dark{

#broadcastPopup{

.approved-super{

}

.popup-box{

backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.8);

#loading{

#loading.show{

.btn-gold{

.btn-grid{

.btn-action{

.btn-action .row{

body.dark .login-box,
body.dark .topbar{

}

body.dark input{

color:white;

.spinner{

height:40px;
border:4px solid #f3f3f3;
border-top:4px solid #2563eb;

}

0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}

.toast-success{background:#16a34a}

</style>
</head>

<script>
const BASE="https://wkotvhxcwzjvkdvmfbvy.supabase.co/rest/v1/";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indrb3R2aHhjd3pqdmtkdm1mYnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0ODczNzMsImV4cCI6MjA5MTA2MzM3M30.FXVcJNjz5JVBaBrX-PI9m2BmBLew6ja2tf1sIEeUbc0";

let CURRENT_USER=null;
let expiredCache = {};
let CURRENT_ROLE=null;
let CURRENT_FILTER="all";
let CURRENT_SEARCH_DATA = [];
let broadcastInterval = null;
let lastbroadcastId = null;

// TOAST
function showToast(msg,type="info"){
let t=document.getElementById("toast");
t.className="";
t.classList.add("show");

if(type==="success") t.classList.add("toast-success");
else if(type==="error") t.classList.add("toast-error");
else t.classList.add("toast-info");

t.innerText=msg;

setTimeout(()=>{t.classList.remove("show");},2000);
}


function showBroadcastPopup(title, msg){
  let el = document.getElementById("broadcastPopup");

  document.getElementById("bpTitle").innerText = title;
  document.getElementById("bpMsg").innerHTML = msg.replace(/\n/g, "<br>");

  el.style.display = "flex";

  setTimeout(()=>{
    el.classList.add("show");
  },10);
}

function closeBroadcastPopup(){
  let el = document.getElementById("broadcastPopup");

  el.classList.remove("show");

  setTimeout(()=>{
    el.style.display = "none";
  },200);
}


let isHistoryOpen = false;

function toggleBroadcastHistory(){

  let box = document.getElementById("broadcastList");
  let btn = document.getElementById("btnHistory");

  if(!isHistoryOpen){
    // OPEN
    loadBroadcastHistory();
    btn.innerText = "Tutup History";
    isHistoryOpen = true;
  } else {
    // CLOSE
    box.style.display = "none";
    btn.innerText = "History Broadcast";
    isHistoryOpen = false;
  }

  // 🔥 TARUH DI SINI
  btn.classList.toggle("btn-gold", isHistoryOpen);
}

function loadBroadcastHistory(){
  let box = document.getElementById("broadcastList");
  box.style.display = "block";
  box.innerHTML = "Loading...";

  fetch(BASE + "broadcast?order=created_at.desc", getHeader())
    .then(r => r.json())
    .then(d => {

      box.innerHTML = "";

      if(!d.length){
        box.innerHTML = "Belum ada broadcast";
        return;
      }

      d.forEach(b => {
        box.innerHTML += `
          <div class="card">
            <b>${b.title}</b>
            <div class="small">${b.created_at}</div>
            <div>${b.message}</div>

            <button onclick="deleteBroadcast('${b.id}')"
              style="margin-top:8px;background:#dc2626;color:white;padding:6px 10px;border:none;border-radius:6px">
              Hapus
            </button>
          </div>
        `;
      });

    });
}

function deleteBroadcast(id){

  if(CURRENT_ROLE !== "admin" && CURRENT_ROLE !== "super_admin"){
    showToast("No access bro!", "error");
    return;
  }

  if(!confirm("Yakin mau hapus broadcast ini?")) return;

  fetch(BASE + "broadcast?id=eq." + id, {
    method: "DELETE",
    headers: getHeader().headers
  })
  .then(res => {
    if(res.ok){
      showToast("Broadcast dihapus", "success");
      loadBroadcastHistory(); // refresh list
    } else {
      showToast("Gagal hapus", "error");
    }
  });
}

  return;
}

let userData = d[0];

if(userData.status === "banned"){
  showToast("Akun dibanned","error");
  return;
}

CURRENT_USER=d[0].username;
CURRENT_ROLE=d[0].role;
loginDiv.style.display="none";
panel.style.display="block";
listenbroadcast();
loadDashboard();

});
}

// UI

  formBox.style.display =

// FILTER

CURRENT_FILTER=type;
list.style.display="block";
btnData.innerText="Sembunyikan Data";
applyFilter();
}

function applyFilter(){
  if(CURRENT_FILTER === "search") return;
  loadAll();
}

// RANDOM PASS
function randomPass(id){
let chars="abcdefghijklmnopqrstuvwxyz0123456789";
let pass="";
for(let i=0;i<8;i++) pass+=chars[Math.floor(Math.random()*chars.length)];
document.getElementById(id).value=pass;

  showLoading(true);
  fetch(BASE+"users?role=eq.admin",getHeader())

  })

fetch(BASE+"users?role=eq.user",getHeader())

updateUI(d);

});
}
function loadAll(){
showLoading(true);
fetch(BASE+"users",getHeader())
.then(r=>r.json())
.then(d=>{
updateUI(d);

});
}

function autoExpireCheck(data){
  let now = new Date();

  data.forEach(u=>{
    if(
      u.expired_at &&
      new Date(u.expired_at) < now &&
      u.status !== "expired" &&
      !expiredCache[u.id]
    ){
      expiredCache[u.id] = true;

      patch(u.id, {
        status: "expired"
      }, false);

      console.log("Auto expired:", u.username);
    }
  });
}

function updateUI(d){
  let scrollPos = list.scrollTop;

  autoExpireCheck(d); // 🔥 TAMBAH INI

  showData(d);
  loadDashboard();

  list.scrollTop = scrollPos;
}



// SHOW DATA
function showData(data){
list.innerHTML="";
let now=new Date();

data.forEach((u)=>{

let realStatus=u.status;
if(u.expired_at && new Date(u.expired_at)<now){
realStatus="expired";
}

let isTrial = (u.approved_by || "").includes("TRIAL");

let statusClass=
isTrial ? "trial" :
realStatus==="active"?"active":
realStatus==="pending"?"pending":
realStatus==="banned"?"banned":
"expired";

let approveClass = "";
let approveText = u.approved_by || "-";

if(approveText.toLowerCase().includes("(admin)")){
  approveClass = "approved-admin";
}
else if(approveText.toLowerCase().includes("(super_admin)")){
  approveClass = "approved-super";
}

list.innerHTML+=`
<div class="card ${u.role}">
<b>${u.username}</b> 
<span class="badge ${statusClass}">
${isTrial ? "trial" : realStatus}
</span> 
<span class="badge">${u.role}</span>

<div class="small">Created: ${u.created_at||'-'}</div>
<div class="small">Expired: ${u.expired_at ? new Date(u.expired_at).toLocaleString("id-ID") : '-'}</div>
<div class="small">
  Approved by: <span class="${approveClass}">${approveText}</span>
</div>


<br>

Username:<input id="user_${u.id}" value="${u.username}">

<select id="status_${u.id}">
<option value="active" ${realStatus=="active"?"selected":""}>active</option>
<option value="banned" ${realStatus=="banned"?"selected":""}>banned</option>
<option value="expired" ${realStatus=="expired"?"selected":""}>expired</option>
<option value="pending" ${realStatus=="pending"?"selected":""}>pending</option>
</select>

<div style="display:flex;gap:5px">
<input id="pass_${u.id}" value="${u.password}">
<button onclick="randomPass('pass_${u.id}')">Generate</button>
</div>

Device:<input id="device_${u.id}" value="${u.device_id||""}">
Expired:<input type="datetime-local" id="exp_${u.id}" 
${(CURRENT_ROLE==="admin" && u.role==="admin") ? "disabled" : ""}
value="${
  u.expired_at 
  ? (() => {
      let d = new Date(u.expired_at);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0,16);
    })()
  : ''
}">

<div class="btn-group">
${(CURRENT_ROLE==="admin" && u.role !== "user") ? `` : 
`<button class="btn-save" onclick="saveUser('${u.id}')">Save</button>`}

${(CURRENT_ROLE==="super_admin" || (CURRENT_ROLE==="admin" && u.role==="user")) ? 
`<button class="btn-delete" onclick="deleteUser('${u.id}')">Delete</button>` 
: ``}
</div>

<div class="btn-group">
${(CURRENT_ROLE==="admin" && u.role !== "user") ? `` : 
`<button class="btn-approve" onclick="approveUser('${u.id}')">Approve</button>`}

${(CURRENT_ROLE==="admin" && u.role !== "user") ? `` : 
`<button class="btn-reset" onclick="resetDevice('${u.id}')">Reset</button>`}
</div>

<div class="btn-group">
<button onclick="addDays('${u.id}',3)">3D</button>
<button onclick="addDays('${u.id}',7)">7D</button>
<button onclick="addDays('${u.id}',14)">14D</button>
<button onclick="addDays('${u.id}',30)">30D</button>
</div>

<div class="btn-group">
<button class="btn-small btn-trial" onclick="trial('${u.id}',1)">Trial 1day</button>
<button class="btn-small btn-trial" onclick="trial('${u.id}',3)">Trial 3day</button>
</div>

</div>`;
});
}

// ACTION
function saveUser(id){

fetch(BASE+"users?id=eq."+id, getHeader())
.then(r=>r.json())
.then(d=>{

  let target = d[0];

  // 🔥 TAMBAHAN PENTING
  if(CURRENT_ROLE==="admin" && target.role !== "user"){
    showToast("Admin hanya boleh edit user","error");
    return;
  }

  let dExp = val('exp_',id) ? new Date(val('exp_',id)) : null;

  patch(id,{
    username:val('user_',id),
    password:val('pass_',id),
    status:val('status_',id),
    device_id:val('device_',id),
    expired_at: dExp ? dExp.toISOString() : null
  });

  showToast("Data disimpan","success");

});
}

function deleteUser(id){

  fetch(BASE+"users?id=eq."+id, getHeader())
  .then(r=>r.json())
  .then(d=>{
    let target = d[0];

    // ❌ ADMIN hanya boleh hapus USER
    if(CURRENT_ROLE==="admin" && target.role !== "user"){
      showToast("Admin hanya boleh hapus user","error");
      return;
    }

    if(CURRENT_ROLE!=="admin" && CURRENT_ROLE!=="super_admin"){
      showToast("No access bro!","error");
      return;
    }

    if(confirm("Hapus?")){
      fetch(BASE+"users?id=eq."+id,{
        method:"DELETE",
        headers:getHeader().headers
      }).then(res=>{
        if(res.ok){
          applyFilter();
          showToast("User dihapus","success");
        }else{
          showToast("Gagal delete","error");
        }
      });
    }

  });
}

function approveUser(id){

  if(CURRENT_ROLE !== "admin" && CURRENT_ROLE !== "super_admin"){
    showToast("No access bro!", "error");
    return;
  }

  fetch(BASE + "users?id=eq." + id, getHeader())
  .then(r => r.json())
  .then(d => {

      let user = d[0];

      let baseDate = user.expired_at 
          ? new Date(user.expired_at) 
          : new Date();

      baseDate.setDate(baseDate.getDate() + 30);

      let approver = `${CURRENT_USER} (${CURRENT_ROLE}) - APPROVE`;

      patch(id, {
          status: "active",
          expired_at: baseDate.toISOString(),
          approved_by: approver
      });

      showToast("User di-approve", "success");
  });
}

function resetDevice(id){
patch(id,{device_id:null});
showToast("Device direset","info");
applyFilter();
}

function patch(id,data, reload=true){

  fetch(BASE+"users?id=eq."+id, getHeader())
  .then(r=>r.json())
  .then(d=>{
    let target = d[0];

    // ❌ ADMIN GAK BOLEH EDIT SIAPAPUN SELAIN USER
    if(CURRENT_ROLE==="admin" && target.role !== "user"){
      showToast("Admin hanya boleh edit user","error");
      return;
    }

    fetch(BASE+"users?id=eq."+id,{
      method:"PATCH",
      headers:{...getHeader().headers,"Content-Type":"application/json"},
      body:JSON.stringify(data)
    }).then(()=>{
      if(reload) applyFilter();
    });

  });
}

function val(p,id){
return document.getElementById(p+id).value;
}

// SEARCH
let searchTimeout;

function searchUser(){
  let keyword = search.value.trim();

  clearTimeout(searchTimeout);

  searchTimeout = setTimeout(()=>{

    if(keyword === ""){
      CURRENT_FILTER = "all";
      CURRENT_SEARCH_DATA = [];

      list.style.display = "none";
      btnData.innerText = "Tampilkan Data";

      showLoading(false);
      return;
    }

    CURRENT_FILTER = "search";
    showLoading(true);

    list.style.display = "block";
    btnData.innerText = "Sembunyikan Data";

function trial(id, days){

    fetch(BASE + "users?id=eq." + id, getHeader())
    .then(r => r.json())
    .then(d => {

        let user = d[0];

        // 🔒 CEK TRIAL BY ACCOUNT
        if(user.approved_by?.toUpperCase().includes("TRIAL")){
            showToast("User sudah pernah trial","error");
            return;
        }

        // 🔒 CEK TRIAL BY DEVICE
        if((user.device_id || "").includes("TRIAL_USED")){
            showToast("Device sudah pernah trial","error");
            return;
        }

        let exp = new Date();
exp.setHours(exp.getHours() + (days * 24));

        patch(id,{
            status:"active",
            expired_at:exp.toISOString(),
            approved_by:`${CURRENT_USER} (${CURRENT_ROLE}) - TRIAL`,
            device_id:(user.device_id || "") + "_TRIAL_USED" // 🔥 tandain device
        });

        showToast("Trial "+days+" hari","success");
    });
}

function tambahUser(mode=null){

if(!u_user.value || !u_pass.value){
showToast("Username & password wajib","error");
return;
}

// VALIDASI TRIAL
if(mode && mode.includes("TRIAL") && !u_device.value){
showToast("Device wajib untuk trial","error");
return;
}

let data = {
username:u_user.value,
password:u_pass.value,
device_id:u_device.value||null,
role:"user",
status:u_status.value||"active",
created_at:new Date().toISOString()
};



/* ================= EXPIRED CONTROL ================= */
let exp = new Date();

if(mode==="3D") exp.setDate(exp.getDate()+3);
else if(mode==="7D") exp.setDate(exp.getDate()+7);
else if(mode==="14D") exp.setDate(exp.getDate()+14);
else if(mode==="30D") exp.setDate(exp.getDate()+30);

/* ================= TRIAL ================= */
if(mode==="TRIAL1"){
  exp.setHours(exp.getHours()+24);
  data.approved_by = `${CURRENT_USER} (${CURRENT_ROLE}) - TRIAL`;

  if(!(data.device_id || "").includes("TRIAL_USED")){
    data.device_id = (data.device_id || "") + "_TRIAL_USED";
  }
}

if(mode==="TRIAL3"){
  exp.setHours(exp.getHours()+72);
  data.approved_by = `${CURRENT_USER} (${CURRENT_ROLE}) - TRIAL`;

  if(!(data.device_id || "").includes("TRIAL_USED")){
    data.device_id = (data.device_id || "") + "_TRIAL_USED";
  }
}

/* ================= APPROVE ================= */
if(mode==="APPROVE"){
  exp.setDate(exp.getDate()+30);
  data.approved_by = `${CURRENT_USER} (${CURRENT_ROLE}) - APPROVE`;
}

// hanya set expired kalau memang mode butuh expiry
if(
  mode === "3D" ||
  mode === "7D" ||
  mode === "14D" ||
  mode === "30D" ||
  mode === "TRIAL1" ||
  mode === "TRIAL3" ||
  mode === "APPROVE"
){
  data.status = "active";
  data.expired_at = exp.toISOString();
}
else {
  data.expired_at = document.getElementById("u_exp")?.value
    ? new Date(u_exp.value).toISOString()
    : new Date(Date.now() + 86400000).toISOString();
}

create(data);
showToast("User dibuat ("+(mode||"manual")+")","success");
}

function openbroadcast(){

function closebroadcast(){
  document.getElementById("broadcastModal").style.display="none";

function sendbroadcast(){
  let title = document.getElementById("broadcastTitle").value.trim();
  let msg = document.getElementById("broadcastMsg").value.trim();

  if(!title || !msg){
    showToast("Isi lengkap dulu","error");
    return;
  }

  fetch(BASE + "broadcast", {
    method: "POST",
    headers: {
      apikey: KEY,
      Authorization: "Bearer " + KEY,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify({
      title: title,
      message: msg,
      created_at: new Date().toISOString()
    })
  })
  .then(async (res) => {
    let text = await res.text();

    if(!res.ok){
      throw new Error(text);
    }

    return JSON.parse(text);
  })
  .then(() => {
    showToast("Broadcast terkirim ", "success");

    // 🔥 kosongin input biar enak
    document.getElementById("broadcastTitle").value = "";
    document.getElementById("broadcastMsg").value = "";

    closebroadcast();
  })
  .catch(err => {
    console.log("ERROR broadcast:", err.message); // ❗ cuma log, gak popup
    showToast("Gagal kirim broadcast", "error");
  });
}


function getDeviceId(){
  let id = localStorage.getItem("device_id");

  if(!id){
    id = "DEV_" + Math.random().toString(36).substring(2,10);
    localStorage.setItem("device_id", id);
  }

  return id;
}

function copyDevice(){
  let id = getDeviceId();

  // coba cara modern dulu
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(id)
      .then(()=>{
        showToast("Device ID dicopy","success");
      })
      .catch(()=>{
        fallbackCopy(id);
      });
  } else {
    // fallback kalau gagal
    fallbackCopy(id);
  }
}

// 🔥 fallback manual (PASTI WORK)
function fallbackCopy(text){
  let temp = document.createElement("textarea");
  temp.value = text;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);

  showToast("Device ID dicopy","success");
}

function listenbroadcast(){
  if(broadcastInterval) return;

  broadcastInterval = setInterval(()=>{

    const popup = document.getElementById("broadcastPopup");
    if(popup && popup.classList.contains("show")) return;

    fetch(BASE+"broadcast?order=created_at.desc&limit=1", getHeader())
      .then(r=>r.json())
      .then(d=>{
        if(!d.length) return;

        const b = d[0];

        // 🔥 CEK LOCALSTORAGE
        let seen = localStorage.getItem("broadcast_seen_"+b.id);
        if(seen) return;

        localStorage.setItem("broadcast_seen_"+b.id, "1");

        showBroadcastPopup(b.title, b.message);
      })
      .catch(console.log);

  }, 3000);
}
